name = "ministream"
main = "src/worker.js"
compatibility_date = "2026-11-25"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/go/*"]

[[d1_databases]]
binding = "DB"
database_name = "ministream-db"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"
migrations_dir = "migrations"
